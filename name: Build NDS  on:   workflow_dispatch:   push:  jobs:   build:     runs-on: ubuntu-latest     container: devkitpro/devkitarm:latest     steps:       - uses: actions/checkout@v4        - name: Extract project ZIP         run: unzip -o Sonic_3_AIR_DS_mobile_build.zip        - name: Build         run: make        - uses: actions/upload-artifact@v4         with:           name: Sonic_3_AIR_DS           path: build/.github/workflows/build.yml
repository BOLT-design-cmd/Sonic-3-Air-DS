
name: Build NDS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o Sonic_3_AIR_DS_mobile_build.zip

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: Sonic_3_AIR_DS
          path: build/Sonic_3_AIR_DS.nds
          
